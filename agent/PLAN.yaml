      - id: A2
        text: Shared 예시 Product Created와 Ground Truth 줄로 만든 결과가 예시 Vision Result와 같은 dict이고 encode의 키 순서도 같으며, Ground Truth의 다른 필드가 결과에 없다 (C-02)
        check: {type: command, run: "make venv >/dev/null && .venv/bin/python -m pytest -q tests/test_payload.py::test_shared_example_parses tests/test_payload.py::test_build_matches_shared_example tests/test_payload.py::test_encoded_key_order_matches_shared_example tests/test_payload.py::test_no_other_ground_truth_fields"}
      - id: A3
        text: Product Created 검증이 spec 01 2절 순서대로 invalid_json(UTF-8 아님, 배열, NaN 포함)·invalid_payload(schema_version true 등)·invalid_product_id(유니코드 숫자, 끝 \n)·invalid_timestamp·invalid_image_path를 내고 모르는 필드를 무시한다 (C-03)
        check: {type: command, run: "make venv >/dev/null && .venv/bin/python -m pytest -q tests/test_payload.py::test_unknown_fields_ignored tests/test_payload.py::test_invalid_json tests/test_payload.py::test_invalid_payload tests/test_payload.py::test_invalid_product_id tests/test_payload.py::test_invalid_timestamp tests/test_payload.py::test_invalid_image_path"}
      - id: A4
        text: Ground Truth 조회가 잘린 마지막 줄·빈 파일을 missing으로, 중복을 duplicate로, 깨진 줄을 건너뛰고 세며, 읽기 실패를 unreadable로, defect·defect_type 위반을 invalid로 보고 다른 필드는 보지 않는다 (spec 01 3절, C-03)
        check: {type: command, run: "make venv >/dev/null && .venv/bin/python -m pytest -q tests/test_ground_truth.py::test_shared_example_line_found tests/test_ground_truth.py::test_incomplete_last_line_ignored tests/test_ground_truth.py::test_empty_file_is_missing tests/test_ground_truth.py::test_duplicate tests/test_ground_truth.py::test_bad_lines_skipped_and_counted tests/test_ground_truth.py::test_unreadable tests/test_ground_truth.py::test_invalid tests/test_ground_truth.py::test_other_fields_ignored"}
      - id: A5
        text: process()가 정상 입력에 Publish를, spec 01 5절의 reason 9개 각각에 Drop을 돌려주고, Drop의 product_id·timestamp는 검증을 통과한 값만 싣고, bad_lines를 Publish에도 싣는다 (C-03)
        check: {type: command, run: "make venv >/dev/null && .venv/bin/python -m pytest -q tests/test_process.py::test_publish_outcome tests/test_process.py::test_each_reason tests/test_process.py::test_drop_carries_ids_only_when_valid tests/test_process.py::test_bad_lines_reported_on_publish"}
      - id: A6
        text: 1,800줄 Ground Truth에서 process() 한 번이 평균 50 ms 이하이고 측정값을 출력한다 (C-07 단위, D-21)
        check: {type: command, run: "make venv >/dev/null && .venv/bin/python -m pytest -q -s tests/test_process.py::test_mean_time_1800_lines"}
      - id: A7
        text: payload·ground_truth·process 모듈이 paho를 import하지 않는다 (spec 01 1절)
        check: {type: command, run: "for f in payload ground_truth process; do test -f src/vision_inspection/$f.py || exit 1; done && ! grep -Eq '^[[:space:]]*(import|from)[[:space:]]+paho' src/vision_inspection/payload.py src/vision_inspection/ground_truth.py src/vision_inspection/process.py"}
      - id: A8
        text: 단위 테스트 전체가 통과한다
        check: {type: command, run: "make test"}
    size: M
  # M3 MQTT 서비스: docs/plan/02-service.md
  - id: VIS-3
    milestone: M3
    type: feature
    title: paho MQTT 서비스(app, __main__)와 Docker Mosquitto 연동 테스트, verify broker
    why: 처리 코어를 실제 Broker에 붙여 Product Created 하나에 Vision Result 하나를 QoS 1·retain false로 발행하고, 재연결·재구독, 기동 확인 파일, SIGTERM·설정 오류 종료 코드를 spec대로 만든다 (spec 02, D-08, D-09, D-13~D-16, C-04, C-05, C-06, C-07)
    depends_on: [VIS-2]
    contract: [docs/INTERFACES.md, docs/CONVENTIONS.md]
    scope: [src/**, tests/**, Makefile, agent/config.yaml, docs/spec/02-service.md, docs/spec/DECISIONS.md]
    acceptance:
      - id: A1
        text: 잘못된 설정(MQTT_URL=http://h)으로 python -m vision_inspection을 띄우면 10초 안에 종료 코드 2로 끝나고 마지막 줄이 error·invalid_config다 (C-05 일부)
        check: {type: command, run: "make venv >/dev/null && .venv/bin/python -m pytest -q tests/test_main.py::test_invalid_config_exits_2"}
      - id: A2
        text: 실제 Mosquitto에서 Shared 예시 Product Created에 대해 5초 안에 Shared 예시와 같은 Vision Result 하나가 qos 1로 오고, received와 published(latency_ms int 0 이상) 로그가 남으며, 그 뒤 새 구독자가 retained 결과를 받지 않는다(retain false 발행) (C-02, C-04, C-06)
        check: {type: command, run: "make venv >/dev/null && .venv/bin/python -m pytest -q tests/test_broker.py::test_publishes_shared_example"}
      - id: A3
        text: 잘못된 입력 8종 뒤 정상 sentinel을 보내면 결과는 sentinel 하나뿐이고 dropped reason이 보낸 순서와 같으며, Ground Truth 파일이 나중에 생겨도 상태 없이 이어서 처리한다 (C-03, C-04)
        check: {type: command, run: "make venv >/dev/null && .venv/bin/python -m pytest -q tests/test_broker.py::test_invalid_inputs_not_published tests/test_broker.py::test_ground_truth_created_later"}
      - id: A4
        text: Broker 재시작 때 disconnected와 함께 기동 확인 파일이 지워지고, 15초 안에 다시 connected(기동 확인 파일 다시 생성)되어 결과를 발행하고, Broker보다 먼저 떠도 connect_failed 뒤 15초 안에 연결되며, SIGTERM에 5초 안 종료 코드 0·마지막 줄 stopped·기동 확인 파일 삭제다 (C-05)
        check: {type: command, run: "make venv >/dev/null && .venv/bin/python -m pytest -q tests/test_broker.py::test_broker_restart_resubscribes tests/test_broker.py::test_starts_before_broker tests/test_broker.py::test_sigterm_exits_0"}
      - id: A5
        text: 1,800줄 Ground Truth에서 30개 Vision Result 지연이 모두 2초 이하이고 중앙값 0.5초 이하이며 측정값을 출력한다 (C-07 연동, D-21)
        check: {type: command, run: "make venv >/dev/null && .venv/bin/python -m pytest -q -s tests/test_broker.py::test_latency_1800_lines"}
      - id: A6
        text: 연동 테스트에 skip 경로가 없고 docker 마커가 붙어 있다(Docker를 못 쓰면 실패, make test에서는 빠짐. spec 04 1절)
        check: {type: command, run: "test -f tests/test_broker.py && ! grep -Eq 'pytest\\.skip|mark\\.skip|skipif|importorskip' tests/test_broker.py tests/conftest.py && grep -q 'mark.docker' tests/test_broker.py"}
      - id: A7
        text: paho를 import하는 모듈은 src/vision_inspection/app.py 하나다 (spec 02 1절)
        check: {type: command, run: "test -f src/vision_inspection/app.py && test -f src/vision_inspection/__main__.py && test \"$(grep -rlE '^[[:space:]]*(import|from)[[:space:]]+paho' src)\" = src/vision_inspection/app.py"}
      - id: A8
        text: agent/config.yaml verify에 spec 04 4절의 broker 명령이 그대로 있고, make docker-test가 실제로 테스트를 모아 모두 통과한다(pytest 요약이 'N passed'로 시작)
        check: {type: command, run: "python3 -c \"import sys, yaml; v = yaml.safe_load(open('agent/config.yaml'))['verify']; sys.exit(0 if {'name': 'broker', 'run': 'make docker-test'} in v else 1)\" && out=$(make docker-test 2>&1) && printf '%s\\n' \"$out\" | grep -Eq '^[0-9]+ passed'"}
      - id: A9
        text: 단위 테스트 전체가 통과한다
        check: {type: command, run: "make test"}
    size: M
  # M4 패키징: docs/plan/03-runtime.md
  - id: VIS-4
    milestone: M4
    type: feature
    title: Dockerfile, 단독 확인용 compose.yaml, compose smoke와 verify smoke
    why: integration이 저장소 루트 Dockerfile로 이미지를 만들고 읽기 전용 /data 마운트와 healthcheck로 조합할 수 있어야 한다. smoke가 그 실행 정의 전체를 자동으로 확인한다 (spec 03 5~7절, AGREEMENTS V-04·V-05, D-15, D-17, C-08, C-09)
    depends_on: [VIS-3]
    contract: [docs/INTERFACES.md, docs/CONVENTIONS.md]
    scope: [Dockerfile, .dockerignore, compose.yaml, .env.example, tests/**, Makefile, agent/config.yaml, docs/COMPONENT.md, docs/spec/03-runtime.md, docs/spec/DECISIONS.md]
    acceptance:
      - id: A1
        text: compose smoke가 통과한다. up --build --wait로 healthy, /data RW=false, 볼륨에 넣은 Ground Truth로 P-00000001(dent)·P-00000002(양품) 결과만 오고, 로그가 모두 JSON이며, stop -t 10 뒤 종료 코드 0과 마지막 줄 stopped다 (spec 04 3.3절, C-04, C-05, C-06, C-08)
        check: {type: command, run: "make venv >/dev/null && .venv/bin/python -m pytest -q tests/test_smoke.py::test_compose_smoke"}
      - id: A2
        text: smoke 테스트에 skip 경로가 없다(Docker를 못 쓰면 실패, spec 04 1절)
        check: {type: command, run: "test -f tests/test_smoke.py && ! grep -Eq 'pytest\\.skip|mark\\.skip|skipif|importorskip' tests/test_smoke.py tests/conftest.py"}
      - id: A3
        text: Dockerfile이 spec 03 5절의 기반 이미지·HEALTHCHECK·진입점을 쓰고 포트·볼륨을 선언하지 않으며, 환경 변수와 .env 없이 해석한 compose 정의에서 프로젝트 이름이 vision-inspection, vision-inspection 서비스의 /data가 읽기 전용이고 포트가 없으며 Mosquitto는 127.0.0.1:1883에 묶인다 (C-08, V-04, V-05)
        check: {type: command, run: "grep -qx 'FROM python:3.12-slim-bookworm' Dockerfile && grep -q '^HEALTHCHECK' Dockerfile && grep -Eq '^ENTRYPOINT \\[\"python\", ?\"-m\", ?\"vision_inspection\"\\]' Dockerfile && ! grep -Eq '^(EXPOSE|VOLUME)' Dockerfile && env -u VIS_MQTT_PORT -u COMPOSE_PROJECT_NAME docker compose --env-file /dev/null config --format json | python3 -c \"import json, sys; c = json.load(sys.stdin); s = c['services']['vision-inspection']; v = s['volumes']; p = c['services']['mosquitto']['ports']; sys.exit(not (c['name'] == 'vision-inspection' and len(v) == 1 and v[0]['target'] == '/data' and v[0].get('read_only') is True and v[0]['type'] == 'volume' and not s.get('ports') and len(p) == 1 and p[0]['host_ip'] == '127.0.0.1' and str(p[0]['published']) == '1883'))\""}
      - id: A4
        text: .env.example에 spec 03 2절의 환경 변수 7개가 있고, .dockerignore가 tests·docs·agent·.venv·.git·data·.env를 뺀다 (spec 03 5·7절)
        check: {type: command, run: "for v in MQTT_URL MQTT_CLIENT_ID PRODUCT_CREATED_TOPIC VISION_RESULT_TOPIC IMAGE_ROOT LOG_LEVEL HEALTH_FILE; do grep -Eq \"^#? ?$v=\" .env.example || exit 1; done && for e in .git .venv tests docs agent data .env; do grep -qx \"$e\" .dockerignore || exit 1; done"}
      - id: A5
        text: 이미지 안에 /data가 없다(빈 named volume에 이미지 내용이 복사되지 않게, D-17)
        check: {type: command, run: "docker build -q -t vision-inspection:local . >/dev/null && docker run --rm --entrypoint sh vision-inspection:local -c 'test ! -e /data'"}
      - id: A6
        text: docs/COMPONENT.md 실행 절이 실제 명령(docker compose up -d --build --wait, make smoke, 로컬 실행)을 적고 미정 표시가 없다 (C-09)
        check: {type: command, run: "grep -q 'docker compose up -d --build --wait' docs/COMPONENT.md && grep -q 'make smoke' docs/COMPONENT.md && grep -q 'python -m vision_inspection' docs/COMPONENT.md && ! grep -q '<미정' docs/COMPONENT.md"}
      - id: A7
        text: agent/config.yaml verify가 spec 04 4절 네 항목(agent-files, unit, broker, smoke)과 그 순서 그대로이고, make smoke가 실제로 테스트를 모아 통과한다 (C-09. 나머지 셋은 verify가 함께 돌린다)
        check: {type: command, run: "python3 -c \"import sys, yaml; v = yaml.safe_load(open('agent/config.yaml'))['verify']; need = [{'name': 'agent-files', 'run': 'python3 agent/core/tools/validate.py'}, {'name': 'unit', 'run': 'make test'}, {'name': 'broker', 'run': 'make docker-test'}, {'name': 'smoke', 'run': 'make smoke'}]; sys.exit(0 if v == need else 1)\" && out=$(make smoke 2>&1) && printf '%s\\n' \"$out\" | grep -Eq '^[0-9]+ passed'"}
    size: M
